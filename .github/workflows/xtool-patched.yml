name: Build patched xtool

on:
  workflow_dispatch:
    inputs:
      auth_client_info_candidate:
        description: Build the Linux XADI client-info repair candidate (not the audited default)
        type: boolean
        default: false
  push:
    branches-ignore: ["codex/xtool-linux-auth-fix"]
    paths:
      - "tools/xtool/patches/**"
      - ".github/workflows/xtool-patched.yml"

permissions:
  contents: read

env:
  XTOOL_COMMIT: 2d58d987edff728fccebc6df643b1672e3583f00

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Fetch pinned xtool source
        run: |
          git clone https://github.com/xtool-org/xtool.git "$RUNNER_TEMP/xtool"
          git -C "$RUNNER_TEMP/xtool" checkout "$XTOOL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/xtool" rev-parse HEAD)" = "$XTOOL_COMMIT"

      - name: Apply and verify EvaOrbit patches
        env:
          AUTH_CLIENT_INFO_CANDIDATE: ${{ inputs.auth_client_info_candidate }}
        run: |
          patches=(
            "$GITHUB_WORKSPACE/tools/xtool/patches/0001-healthkit-background-delivery.patch"
            "$GITHUB_WORKSPACE/tools/xtool/patches/0002-password-auth-compatibility.patch"
          )
          if [[ "$AUTH_CLIENT_INFO_CANDIDATE" == "true" ]]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            patches+=("$GITHUB_WORKSPACE/tools/xtool/patches/0003-linux-anisette-client-info.patch")
            patches+=("$GITHUB_WORKSPACE/tools/xtool/patches/0004-pin-compatible-xadi-build.patch")
            patches+=("$GITHUB_WORKSPACE/tools/xtool/patches/0005-auth-request-start-diagnostics.patch")
            patches+=("$GITHUB_WORKSPACE/tools/xtool/patches/0006-linuxdeploy-git-tag-query.patch")
          fi
          for patch in "${patches[@]}"; do
            git -C "$RUNNER_TEMP/xtool" apply --check "$patch"
            git -C "$RUNNER_TEMP/xtool" apply "$patch"
          done
          grep -R -q 'public static let identifier = "com.apple.developer.healthkit.background-delivery"' "$RUNNER_TEMP/xtool/Sources/XKit"
          grep -R -q 'DeveloperServicesCapability(.healthkit, isFree: true)' "$RUNNER_TEMP/xtool/Sources/XKit"
          grep -R -q 'XTL_AUTH_DIAGNOSTICS' "$RUNNER_TEMP/xtool/Sources"
          grep -R -q 'closesConnectionAfterResponse = true' "$RUNNER_TEMP/xtool/Sources/XKit"
          grep -R -q 'evaorbit-compat-v4-fresh-app-token-tls' "$RUNNER_TEMP/xtool/Sources/XToolSupport"
          grep -R -q 'The response body was intentionally not logged' "$RUNNER_TEMP/xtool/Sources/XKit"
          grep -R -q 'options: .atomic' "$RUNNER_TEMP/xtool/Sources/XKit/Utilities/KeyValueStorage.swift"

      - name: Prepare candidate client-info smoke test
        if: ${{ inputs.auth_client_info_candidate }}
        run: node scripts/verify-xtool-client-info.mjs "$RUNNER_TEMP/xtool" "$RUNNER_TEMP/xtool-client-info-smoke.swift"

      - name: Build patched AppImage
        run: docker build --target build-xtool -t evaorbit-xtool-patched "$RUNNER_TEMP/xtool"

      - name: Compile and run candidate client-info smoke test
        if: ${{ inputs.auth_client_info_candidate }}
        run: docker run --rm --volume "$RUNNER_TEMP/xtool-client-info-smoke.swift:/check.swift:ro" swift:6.3-jammy swift /check.swift

      - name: Extract AppImage
        env:
          AUTH_CLIENT_INFO_CANDIDATE: ${{ inputs.auth_client_info_candidate }}
        run: |
          mkdir -p "$RUNNER_TEMP/xtool-artifact"
          container_id="$(docker create evaorbit-xtool-patched)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/xtool/Linux/packages/." "$RUNNER_TEMP/xtool-artifact/"
          cd "$RUNNER_TEMP/xtool-artifact"
          sha256sum ./*.AppImage > SHA256SUMS
          printf '%s\n' "$XTOOL_COMMIT" > XTOOL_COMMIT.txt
          cp "$GITHUB_WORKSPACE/tools/xtool/patches/0001-healthkit-background-delivery.patch" .
          cp "$GITHUB_WORKSPACE/tools/xtool/patches/0002-password-auth-compatibility.patch" .
          if [[ "$AUTH_CLIENT_INFO_CANDIDATE" == "true" ]]; then
            cp "$GITHUB_WORKSPACE/tools/xtool/patches/0003-linux-anisette-client-info.patch" .
            cp "$GITHUB_WORKSPACE/tools/xtool/patches/0004-pin-compatible-xadi-build.patch" .
            cp "$GITHUB_WORKSPACE/tools/xtool/patches/0005-auth-request-start-diagnostics.patch" .
            cp "$GITHUB_WORKSPACE/tools/xtool/patches/0006-linuxdeploy-git-tag-query.patch" .
            printf '%s\n' '61c02708c9cb046100f500878863fd2122b0d7e3' > XADI_COMMIT.txt
            printf '%s\n' 'Linux authentication candidate. Keep the audited xtool installed; do not replace it or reset provisioning. Live Apple login and device validation are still required.' > AUTH_CANDIDATE.txt
          fi
          sha256sum ./*.patch > PATCH_SHA256SUMS

      - uses: actions/upload-artifact@v6
        with:
          name: xtool-patched-${{ env.XTOOL_COMMIT }}${{ inputs.auth_client_info_candidate && '-linux-auth-candidate' || '' }}
          path: ${{ runner.temp }}/xtool-artifact
          if-no-files-found: error
          retention-days: 30
