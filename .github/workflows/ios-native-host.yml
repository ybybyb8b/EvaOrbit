name: iOS Native Host

on:
  workflow_dispatch:
    inputs:
      local_trackers:
        description: Build the isolated Local-first Tracker PoC
        type: boolean
        default: false
  # Push source changes freely; package frontend updates on demand via workflow_dispatch.
  push:
    paths:
      - "ios/EvaOrbitHost/**"
      - "!ios/EvaOrbitHost/Resources/TrackerWeb/**"
      - "scripts/ios/prepare-assets.sh"
      - "scripts/ios/package-ad-hoc-ipa.sh"
      - ".github/workflows/ios-native-host.yml"

permissions:
  contents: read

jobs:
  build:
    # Use the standard Intel pool to avoid the macOS arm64 capacity queue.
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build bundled Tracker UI
        run: |
          npm ci
          npm run build:trackers
          node --test src/lib/tracker-replica.test.ts src/lib/tracker-local.test.ts src/lib/tracker-readonly.test.ts scripts/tracker-platform-readonly.test.mjs scripts/tracker-shared-ui.test.mjs scripts/tracker-sync-postgres.test.mjs scripts/appearance-preferences.test.mjs scripts/appearance-settings.test.mjs scripts/home-readonly.test.mjs scripts/home-journal-editor.test.mjs scripts/home-refresh.test.mjs scripts/home-timeline-loading.test.mjs scripts/inbox-readonly.test.mjs scripts/memo-readonly.test.mjs scripts/chronicle-readonly.test.mjs src/lib/chronicle.test.ts scripts/subscriptions-readonly.test.mjs scripts/cats-readonly.test.mjs scripts/health-readonly.test.mjs scripts/relations-readonly.test.mjs scripts/relations-regression.test.mjs src/lib/media.test.ts scripts/media-readonly.test.mjs scripts/media-completion-postgres.test.mjs scripts/workspace-readonly.test.mjs scripts/ai-configuration-account.test.mjs scripts/food-readonly.test.mjs scripts/food-readonly-resource.test.mjs scripts/bottom-log-interaction.test.mjs scripts/navigation-shared.test.mjs scripts/food-drink-home.test.mjs scripts/combobox-interaction.test.mjs

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          uname -m
          xcodebuild -version

      - name: Prepare native assets
        run: bash scripts/ios/prepare-assets.sh

      - name: Generate Xcode project
        working-directory: ios/EvaOrbitHost
        run: xcodegen generate

      - name: Compile host and tests for Simulator
        working-directory: ios/EvaOrbitHost
        run: |
          xcodebuild \
            -project EvaOrbitHost.xcodeproj \
            -scheme EvaOrbitHost \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/EvaOrbitHost-Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            EVAORBIT_LOCAL_TRACKERS="${{ inputs.local_trackers && 'YES' || 'NO' }}" \
            build-for-testing

      - name: Run native unit tests on iPhone 16 Pro Simulator
        timeout-minutes: 10
        working-directory: ios/EvaOrbitHost
        run: |
          simulator_os="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "Testing iPhone 16 Pro with the selected Xcode SDK runtime: $simulator_os"
          xcrun simctl list runtimes
          xcodebuild \
            -project EvaOrbitHost.xcodeproj \
            -scheme EvaOrbitHost \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=$simulator_os" \
            -destination-timeout 60 \
            -derivedDataPath "$RUNNER_TEMP/EvaOrbitHost-Simulator" \
            -resultBundlePath "$RUNNER_TEMP/EvaOrbitHost-TestResults.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            EVAORBIT_LOCAL_TRACKERS="${{ inputs.local_trackers && 'YES' || 'NO' }}" \
            test-without-building

      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EvaOrbitHost-tests-${{ inputs.local_trackers && 'TrackersPoC' || 'OnlineHost' }}-${{ github.run_number }}
          path: ${{ runner.temp }}/EvaOrbitHost-TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Build ad-hoc signed device app
        working-directory: ios/EvaOrbitHost
        run: |
          xcodebuild \
            -project EvaOrbitHost.xcodeproj \
            -scheme EvaOrbitHost \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/EvaOrbitHost-Device" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            EVAORBIT_LOCAL_TRACKERS="${{ inputs.local_trackers && 'YES' || 'NO' }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.local_trackers && 'com.evaorbit.nativehost.trackerspoc' || 'com.evaorbit.nativehost' }}" \
            EVAORBIT_URL_SCHEME="${{ inputs.local_trackers && 'evaorbit-trackers-poc' || 'evaorbit' }}" \
            EVAORBIT_DISPLAY_NAME="${{ inputs.local_trackers && 'EvaOrbit Trackers PoC' || 'EvaOrbit' }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Verify entitlements and package IPA
        run: |
          app="$RUNNER_TEMP/EvaOrbitHost-Device/Build/Products/Release-iphoneos/EvaOrbitHost.app"
          bash scripts/ios/package-ad-hoc-ipa.sh "$app" "$RUNNER_TEMP/EvaOrbitHost-Artifact"
          dsym="$RUNNER_TEMP/EvaOrbitHost-Device/Build/Products/Release-iphoneos/EvaOrbitHost.app.dSYM"
          if [[ -d "$dsym" ]]; then
            ditto "$dsym" "$RUNNER_TEMP/EvaOrbitHost-Artifact/EvaOrbitHost.app.dSYM"
          fi
          xcodebuild -version > "$RUNNER_TEMP/EvaOrbitHost-Artifact/XCODE_VERSION.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/EvaOrbitHost-Artifact/GIT_SHA.txt"

      - uses: actions/upload-artifact@v6
        with:
          name: EvaOrbitHost${{ inputs.local_trackers && '-TrackersPoC' || '' }}-ad-hoc-${{ github.run_number }}
          path: ${{ runner.temp }}/EvaOrbitHost-Artifact
          if-no-files-found: error
          retention-days: 14

  tracker-isolation:
    name: Isolated Supabase Tracker integration
    needs: build
    if: ${{ inputs.local_trackers }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start disposable local Supabase
        run: |
          mkdir -p "$RUNNER_TEMP/tracker-stack"
          supabase init --workdir "$RUNNER_TEMP/tracker-stack"
          supabase start --workdir "$RUNNER_TEMP/tracker-stack" > "$RUNNER_TEMP/tracker-stack-start.log" 2>&1
          supabase status --workdir "$RUNNER_TEMP/tracker-stack" -o json > "$RUNNER_TEMP/tracker-stack-status.json"
      - name: Verify migration, APIs, MCP, RLS and recovery
        env:
          TRACKER_ISOLATED_SUPABASE: "1"
          TRACKER_STACK_STATUS: ${{ runner.temp }}/tracker-stack-status.json
        run: node scripts/tracker-isolated-sync.mjs
      - name: Stop disposable services
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/tracker-stack"
