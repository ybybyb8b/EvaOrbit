name: iOS Native Host

on:
  workflow_dispatch:
    inputs:
      local_trackers:
        description: Build the isolated Local-first Tracker PoC
        type: boolean
        default: false
      subscription_poc:
        description: Include the experimental SIWC panel (local Host / Parlor test branch only)
        type: boolean
        default: false
      run_native_tests:
        description: Run the complete EvaOrbitHostTests suite before building the IPA
        type: boolean
        default: false
  # Push source changes freely; package frontend updates on demand via workflow_dispatch.
  push:
    branches-ignore: ["codex/parlor-native-test"]
    paths:
      - "ios/EvaOrbitHost/**"
      - "!ios/EvaOrbitHost/Resources/TrackerWeb/**"
      - "scripts/ios/prepare-assets.sh"
      - "scripts/ios/package-ad-hoc-ipa.sh"
      - ".github/workflows/ios-native-host.yml"

permissions:
  contents: read

jobs:
  build:
    # Use the standard Intel pool to avoid the macOS arm64 capacity queue.
    runs-on: macos-15-intel
    timeout-minutes: ${{ inputs.run_native_tests && 75 || 30 }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate subscription PoC isolation
        env:
          SUBSCRIPTION_POC: ${{ inputs.subscription_poc }}
          LOCAL_TRACKERS: ${{ inputs.local_trackers }}
        run: |
          if [[ "$SUBSCRIPTION_POC" == "true" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$LOCAL_TRACKERS" != "true" || "$GITHUB_REF" != "refs/heads/codex/parlor-native-test" ]]; then
              echo 'SIWC PoC requires manual dispatch on codex/parlor-native-test with local_trackers=true.' >&2
              exit 1
            fi
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build bundled Tracker UI
        run: |
          npm ci
          npm run build:trackers
          node --test src/lib/tracker-replica.test.ts src/lib/tracker-local.test.ts src/lib/tracker-readonly.test.ts scripts/tracker-platform-readonly.test.mjs scripts/tracker-shared-ui.test.mjs scripts/tracker-sync-postgres.test.mjs scripts/appearance-preferences.test.mjs scripts/appearance-settings.test.mjs scripts/home-readonly.test.mjs scripts/home-journal-editor.test.mjs scripts/home-refresh.test.mjs scripts/home-timeline-loading.test.mjs scripts/inbox-readonly.test.mjs scripts/memo-readonly.test.mjs scripts/chronicle-readonly.test.mjs src/lib/chronicle.test.ts scripts/subscriptions-readonly.test.mjs scripts/cats-readonly.test.mjs scripts/health-readonly.test.mjs scripts/relations-readonly.test.mjs scripts/relations-regression.test.mjs src/lib/media.test.ts scripts/media-readonly.test.mjs scripts/media-completion-postgres.test.mjs scripts/workspace-readonly.test.mjs scripts/ai-configuration-account.test.mjs scripts/food-readonly.test.mjs scripts/food-readonly-resource.test.mjs scripts/bottom-log-interaction.test.mjs scripts/navigation-shared.test.mjs scripts/food-drink-home.test.mjs scripts/combobox-interaction.test.mjs

      - name: Verify Native Parlor contracts
        run: node --test src/lib/native-eva.test.ts scripts/native-eva.test.mjs scripts/parlor-native-only.test.mjs

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          uname -m
          xcodebuild -version

      - name: Prepare native assets
        run: bash scripts/ios/prepare-assets.sh

      - name: Generate Xcode project
        working-directory: ios/EvaOrbitHost
        run: xcodegen generate

      - name: Run full native tests on iPhone 16 Pro Simulator
        id: native_tests
        if: ${{ inputs.run_native_tests }}
        timeout-minutes: 40
        working-directory: ios/EvaOrbitHost
        shell: bash
        run: |
          diagnostics="$RUNNER_TEMP/EvaOrbitHost-Tests"
          mkdir -p "$diagnostics"
          xcodebuild -version | tee "$diagnostics/environment.log"
          xcodebuild -showsdks | tee -a "$diagnostics/environment.log"
          xcrun simctl list --json runtimes > "$diagnostics/runtimes.json"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="$(node - "$sdk" "$diagnostics/runtimes.json" 2> >(tee -a "$diagnostics/environment.log" >&2) <<'NODE'
          const [sdk, file] = process.argv.slice(2);
          const { runtimes } = JSON.parse(require("node:fs").readFileSync(file, "utf8"));
          const majorMinor = value => value.split(".").slice(0, 2).join(".");
          const runtime = runtimes.find(value => value.isAvailable &&
            value.identifier.startsWith("com.apple.CoreSimulator.SimRuntime.iOS-") &&
            majorMinor(value.version) === majorMinor(sdk));
          if (!runtime) throw new Error(`No available iOS Simulator runtime matches SDK ${sdk}`);
          console.log(runtime.identifier);
          NODE
          )"
          device="$(xcrun simctl create 'EvaOrbitHost CI' com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$runtime" 2> >(tee -a "$diagnostics/environment.log" >&2))"
          trap 'xcrun simctl shutdown "$device" || true; xcrun simctl delete "$device" || true' EXIT
          printf 'SDK=%s Runtime=%s Device=%s\n' "$sdk" "$runtime" "$device" | tee -a "$diagnostics/environment.log"
          xcrun simctl bootstatus "$device" -b 2>&1 | tee "$diagnostics/simulator.log"
          simulator_settings=()
          # WebKit #293831: iOS 18.5 cannot launch Swift WebKit apps targeting iOS 18.3 or earlier.
          if [[ "$sdk" == "18.5" || "$sdk" == 18.5.* ]]; then
            simulator_settings+=("IPHONEOS_DEPLOYMENT_TARGET=18.4")
          fi
          xcodebuild test \
            -project EvaOrbitHost.xcodeproj \
            -scheme EvaOrbitHost \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$device" \
            -destination-timeout 60 \
            -derivedDataPath "$RUNNER_TEMP/EvaOrbitHost-Simulator" \
            -resultBundlePath "$diagnostics/EvaOrbitHostTests.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO EVAORBIT_LOCAL_TRACKERS=YES \
            "${simulator_settings[@]}" \
            2>&1 | tee "$diagnostics/xcodebuild.log"
          xcrun xcresulttool get test-results summary --path "$diagnostics/EvaOrbitHostTests.xcresult" \
            > "$diagnostics/summary.json"
          node - "$diagnostics/summary.json" <<'NODE'
          const summary = JSON.parse(require("node:fs").readFileSync(process.argv[2], "utf8"));
          if (!(summary.passedTests > 0) || summary.failedTests !== 0 || summary.skippedTests !== 0) {
            throw new Error("The full native suite must run with no failures or skips");
          }
          NODE

      - name: Upload native test diagnostics
        if: ${{ always() && inputs.run_native_tests && steps.native_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: EvaOrbitHost-native-tests
          path: ${{ runner.temp }}/EvaOrbitHost-Tests
          if-no-files-found: warn
          retention-days: 14

      - name: Build ad-hoc signed device app
        if: ${{ success() && (!inputs.run_native_tests || steps.native_tests.outcome == 'success') }}
        working-directory: ios/EvaOrbitHost
        env:
          SUBSCRIPTION_POC: ${{ inputs.subscription_poc }}
        run: |
          poc_args=()
          if [[ "$SUBSCRIPTION_POC" == "true" ]]; then
            poc_args+=("SWIFT_ACTIVE_COMPILATION_CONDITIONS=\$(inherited) PARLOR_SUBSCRIPTION_POC" "EVAORBIT_SUBSCRIPTION_POC=YES")
          fi
          xcodebuild \
            -project EvaOrbitHost.xcodeproj \
            -scheme EvaOrbitHost \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/EvaOrbitHost-Device" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            EVAORBIT_LOCAL_TRACKERS="${{ inputs.local_trackers && 'YES' || 'NO' }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.local_trackers && 'com.evaorbit.nativehost.trackerspoc' || 'com.evaorbit.nativehost' }}" \
            EVAORBIT_URL_SCHEME="${{ inputs.local_trackers && 'evaorbit-trackers-poc' || 'evaorbit' }}" \
            EVAORBIT_DISPLAY_NAME="EvaOrbit" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${poc_args[@]}" \
            build

      - name: Verify entitlements and package IPA
        run: |
          app="$RUNNER_TEMP/EvaOrbitHost-Device/Build/Products/Release-iphoneos/EvaOrbitHost.app"
          output="$RUNNER_TEMP/EvaOrbitHost-Artifact"
          bash scripts/ios/package-ad-hoc-ipa.sh "$app" "$output"
          {
            echo '### EvaOrbitHost-ad-hoc.ipa'
            printf '\n- Git commit `%s`\n' "$GITHUB_SHA"
            printf -- '- IPA SHA-256 `%s`\n' "$(awk '{print $1}' "$output/SHA256SUMS")"
            printf '\n```\n'
            xcodebuild -version
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/EvaOrbitHost-Artifact/EvaOrbitHost-ad-hoc.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14

  tracker-isolation:
    name: Isolated Supabase Tracker integration
    needs: build
    if: ${{ inputs.local_trackers }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.121.0
      - name: Start disposable local Supabase
        run: |
          mkdir -p "$RUNNER_TEMP/tracker-stack"
          supabase init --workdir "$RUNNER_TEMP/tracker-stack"
          supabase start --workdir "$RUNNER_TEMP/tracker-stack" > "$RUNNER_TEMP/tracker-stack-start.log" 2>&1
          supabase status --workdir "$RUNNER_TEMP/tracker-stack" -o json > "$RUNNER_TEMP/tracker-stack-status.json"
      - name: Verify migration, APIs, MCP, RLS and recovery
        env:
          TRACKER_ISOLATED_SUPABASE: "1"
          TRACKER_STACK_STATUS: ${{ runner.temp }}/tracker-stack-status.json
        run: node scripts/tracker-isolated-sync.mjs
      - name: Stop disposable services
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/tracker-stack"
