name: EvaOrbitHost

options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  EvaOrbitHost:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/TrackerWeb
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: WebKit.framework
      - sdk: HealthKit.framework
      - sdk: UserNotifications.framework
      - sdk: EventKit.framework
      - sdk: Security.framework
      - sdk: libsqlite3.tbd
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: $(EVAORBIT_DISPLAY_NAME)
        EvaOrbitBaseURL: https://eva-orbit.vercel.app
        EvaOrbitLocalTrackersEnabled: $(EVAORBIT_LOCAL_TRACKERS)
        EvaOrbitTrackerDevelopmentURL: $(EVAORBIT_TRACKER_DEV_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.evaorbit.nativehost
            CFBundleURLSchemes:
              - $(EVAORBIT_URL_SCHEME)
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: EvaOrbit reads resting energy, active energy, body weight, menstrual flow, sleep, workouts, heart rate, resting heart rate, and heart rate variability that you choose to share from Apple Health. Heart metrics are not synced unless enabled.
        NSHealthUpdateUsageDescription: EvaOrbit writes body weight and menstrual flow records that you save in EvaOrbit to Apple Health.
        NSCalendarsFullAccessUsageDescription: EvaOrbit syncs events only with calendars you select.
        NSRemindersFullAccessUsageDescription: EvaOrbit syncs tasks and alarms only with reminder lists you select.
        NSCalendarsUsageDescription: EvaOrbit syncs events only with calendars you select.
        NSRemindersUsageDescription: EvaOrbit syncs tasks and alarms only with reminder lists you select.
        UILaunchScreen:
          UIColorName: LoadingBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Generated/EvaOrbitHost.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evaorbit.nativehost
        EVAORBIT_LOCAL_TRACKERS: "NO"
        EVAORBIT_TRACKER_DEV_URL: ""
        EVAORBIT_URL_SCHEME: evaorbit
        EVAORBIT_DISPLAY_NAME: EvaOrbit
        PRODUCT_NAME: EvaOrbitHost
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false

  EvaOrbitHostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: EvaOrbitHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evaorbit.nativehost.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  EvaOrbitHost:
    build:
      targets:
        EvaOrbitHost: all
        EvaOrbitHostTests: [test]
    test:
      targets:
        - EvaOrbitHostTests
